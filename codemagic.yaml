workflows:
  ios-release:
    name: Build iOS IPA for Sideloading
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          if [ -f "ios/Podfile" ]; then
            cd ios && pod install || true
          fi
      - name: Build Flutter iOS Release
        script: |
          flutter build ios --release --no-codesign
      - name: Package Payload into IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r -y listcheck.ipa Payload
          ls -lh listcheck.ipa
    artifacts:
      - build/ios/iphoneos/listcheck.ipa
