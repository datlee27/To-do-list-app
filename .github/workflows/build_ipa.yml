name: Build and Export iOS IPA for Sideloading

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || true
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update || pod install

      - name: Build iOS Archive (Unsigned for Sideloading)
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -y listcheck.ipa Payload
          ls -lh listcheck.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: listcheck-iOS-IPA
          path: listcheck.ipa
          retention-days: 14

      - name: Create GitHub Release (Optional for easy download)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: listcheck.ipa
          tag_name: v1.0.${{ github.run_number }}
          name: "Release v1.0.${{ github.run_number }} (listcheck.ipa for iloader)"
          body: |
            ### 📱 listcheck - iOS 17+ Lock Screen & Offline
            - Tải file `listcheck.ipa` bên dưới.
            - Mở ứng dụng **iloader** trên máy Mac.
            - Kéo file `listcheck.ipa` vào iloader và cắm cáp iPhone để cài đặt.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
